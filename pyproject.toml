[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codepatrol-triage-env"
version = "1.0.0"
description = "CodePatrol: AI Incident Triage and Security Code Review Environment"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Khushi Rajora" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0.0",
    "openai>=1.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "openenv-core>=0.2.0",
]

[project.scripts]
server = "app:main"

[project.urls]
Homepage = "https://github.com/Khushirajora/CodePatrol"
Repository = "https://github.com/Khushirajora/CodePatrol"