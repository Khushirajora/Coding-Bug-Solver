name: codepatrol-triage-env
version: "1.0.0"
description: >
  CodePatrol: An automated incident triage and security code review environment
  for evaluating AI agents. The agent triages defects, routes issues across engineering
  squads, audits pull requests for critical vulnerabilities, and outputs an optimal
  risk-prioritized remediation backlog.
author: "CodePatrol Team"
tags:
  - openenv
  - codepatrol
  - code-review
  - security-triage
  - vulnerability-detection
  - software-engineering

tasks:
  - id: easy
    name: "CodePatrol: Single Bug Severity Triage"
    description: >
      Classify the severity tier of a single bug report using CodePatrol badges
      (🔴 critical / 🟠 high / 🟡 medium / 🟢 low). Full credit for exact matches,
      with partial credit for adjacent tiers.
    max_steps: 3
    difficulty: easy
    success_threshold: 0.6

  - id: medium
    name: "CodePatrol: Multi-Team Bug Queue Triage"
    description: >
      Process a queue of 5 bug reports. For each bug, determine its severity tier
      AND assign it to the appropriate engineering squad (frontend, backend, infra, security).
      Scored equally on severity accuracy and routing precision.
    max_steps: 15
    difficulty: medium
    success_threshold: 0.5

  - id: hard
    name: "CodePatrol: End-to-End Security Triage & Code Review Pipeline"
    description: >
      Handle a combined queue of 8 bug reports and 3 pull requests. The agent must
      triage bugs, audit pull requests for security vulnerabilities (e.g. SQL injection,
      credential exposure), and submit a prioritized fix queue ordered by risk.
    max_steps: 25
    difficulty: hard
    success_threshold: 0.4

entrypoint: "uvicorn server.main:app --host 0.0.0.0 --port 7860"

observation_space:
  type: object
  description: "CodePatrol queue item payload with ticket context, allowed actions, and evaluation feedback"
  fields:
    task_id: "string — active task identifier (easy/medium/hard)"
    episode_id: "string — unique ID for this episode run"
    item_index: "int — index of the current queue item (0-based)"
    total_items: "int — total items in this episode's queue"
    item_type: "string — 'bug_report' or 'pull_request'"
    item_id: "string — issue or pull request identifier (e.g., BUG-001, PR-001)"
    title: "string — item headline"
    body: "string — full defect description or pull request diff"
    labels: "list[string] — applied system labels"
    reporter: "string — reporter or pull request author"
    available_actions: "list[string] — valid action names allowed this step"
    step_number: "int — current step within the episode"
    max_steps: "int — maximum step budget for the task"
    current_score: "float — cumulative score normalized to [0.0, 1.0]"
    feedback: "string — evaluation result and visual badge output from previous step"
    echoed_message: "string — mirrors feedback for inference compatibility"

action_space:
  type: string
  description: >
    A JSON string containing an 'action' key and task-specific parameters,
    submitted within the 'message' field.
  examples:
    - '{"action": "classify", "severity": "critical"}'
    - '{"action": "triage", "severity": "high", "team": "backend", "comment": "Database connection pool exhausted"}'
    - '{"action": "review_pr", "verdict": "request_changes", "comment": "SQL injection vulnerability detected in f-string query", "security_issue": true}'
    - '{"action": "prioritize", "order": ["BUG-005", "BUG-001", "PR-002"]}'
    - '{"action": "skip"}'